{{- $sc := default dict .Values.serverConfig }}
{{- $rep := default dict $sc.serverRepresentation }}
{{- $admin := default dict $sc.adminInterfaces }}
{{- $serverSecretRef := default dict $rep.ServerPasswordSecret }}
{{- $telnetSecretRef := default dict $admin.TelnetPasswordSecret }}
{{- $hasInlineServerPassword := and (not $serverSecretRef.name) (ne (default "" $rep.ServerPassword) "") }}
{{- $hasInlineTelnetPassword := and (not $telnetSecretRef.name) (ne (default "" $admin.TelnetPassword) "") }}
{{- if or $hasInlineServerPassword $hasInlineTelnetPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-serverconfig
  namespace: {{ .Release.Namespace }}
  labels:
    7dtd/server: {{ .Release.Name }}
type: Opaque
data:
  {{- if $hasInlineServerPassword }}
  ServerPassword: {{ $rep.ServerPassword | toString | b64enc | quote }}
  {{- end }}
  {{- if $hasInlineTelnetPassword }}
  TelnetPassword: {{ $admin.TelnetPassword | toString | b64enc | quote }}
  {{- end }}
{{- end }}
